<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>PACED Knowledge Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#1B2838; --muted:#44546A; --faint:#5A6B80;
  --line:#D3DBE4; --control:#748599; --navy:#0B2545; --on-navy:#FFFFFF; --navy-soft:#C9D8EA; --navy-accent:#8FD3CC;
  --primary:#0B2545; --on-primary:#FFFFFF; --blue:#1D4E89; --blue-tint:#E8EFF8; --blue-ink:#13315C;
  --teal:#0B7A75; --on-teal:#FFFFFF; --teal-ink:#0A5F5B; --teal-tint:#E3F2F0; --teal-line:#B7DDD8;
  --neutral-tint:#EEF1F4; --mark:#FDE9B8; --focus:#B26A00; --scrim:rgba(11,37,69,.72); --shadow:0 10px 30px rgba(11,37,69,.14);
  --display:'Literata',Georgia,'Times New Roman',serif; --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:10px; --r-lg:14px; --max:1280px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#08131F; --surface:#0F2033; --surface-2:#0B1A2A; --ink:#E6EDF5; --muted:#B3C2D3; --faint:#9FB0C4;
    --line:#223B57; --control:#6F88A6; --navy:#050E19; --on-navy:#FFFFFF; --navy-soft:#B3C2D3; --navy-accent:#7FD3C9;
    --primary:#D5E3F4; --on-primary:#0B2545; --blue:#8DB8EE; --blue-tint:#15304F; --blue-ink:#CFE0F5;
    --teal:#3FB8AE; --on-teal:#04201D; --teal-ink:#7FD3C9; --teal-tint:#0F3533; --teal-line:#1E5A55;
    --neutral-tint:#16283D; --mark:#6B5314; --focus:#F0B04C; --scrim:rgba(2,8,15,.78); --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#08131F; --surface:#0F2033; --surface-2:#0B1A2A; --ink:#E6EDF5; --muted:#B3C2D3; --faint:#9FB0C4;
  --line:#223B57; --control:#6F88A6; --navy:#050E19; --on-navy:#FFFFFF; --navy-soft:#B3C2D3; --navy-accent:#7FD3C9;
  --primary:#D5E3F4; --on-primary:#0B2545; --blue:#8DB8EE; --blue-tint:#15304F; --blue-ink:#CFE0F5;
  --teal:#3FB8AE; --on-teal:#04201D; --teal-ink:#7FD3C9; --teal-tint:#0F3533; --teal-line:#1E5A55;
  --neutral-tint:#16283D; --mark:#6B5314; --focus:#F0B04C; --scrim:rgba(2,8,15,.78); --shadow:0 10px 30px rgba(0,0,0,.45);
}
:root[data-contrast="high"]{
  color-scheme:dark;
  --bg:#000; --surface:#000; --surface-2:#000; --ink:#FFF; --muted:#FFF; --faint:#FFF; --line:#FFF; --control:#FFF;
  --navy:#000; --on-navy:#FFF; --navy-soft:#FFF; --navy-accent:#FFE45C; --primary:#FFE45C; --on-primary:#000;
  --blue:#FFE45C; --blue-tint:#000; --blue-ink:#FFF; --teal:#FFE45C; --on-teal:#000; --teal-ink:#FFE45C; --teal-tint:#000; --teal-line:#FFF;
  --neutral-tint:#000; --mark:#FFE45C; --focus:#FFE45C; --scrim:rgba(0,0,0,.9); --shadow:none;
}
:root[data-contrast="high"] a{text-decoration:underline!important}
:root[data-contrast="high"] mark{color:#000}

*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;color:var(--ink);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
a{color:var(--teal-ink);text-underline-offset:3px}
a:hover{color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}
.sr{position:absolute!important;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-size:.8125rem}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* layout */
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:clamp(16px,4vw,48px)}
.stack{display:flex;flex-direction:column;gap:var(--g,16px)}
.row{display:flex;gap:var(--g,12px);align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--min,340px)),1fr))}
.section{padding-block:56px 0}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.section-head h2{font-size:clamp(1.5rem,2.4vw,2rem)}
.lede{color:var(--muted);font-size:1.0625rem;max-width:62ch}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pad{padding:20px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.xs{font-size:.8125rem}

/* buttons */
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;border-radius:8px;border:1.5px solid transparent;font-weight:600;font-size:.9375rem;cursor:pointer;text-decoration:none;white-space:nowrap;background:none;line-height:1.2}
.btn svg{flex-shrink:0}
.btn-lg{min-height:52px;padding:0 24px;font-size:1rem}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{color:var(--on-primary);filter:brightness(1.15)}
.btn-teal{background:var(--teal);color:var(--on-teal)}
.btn-teal:hover{color:var(--on-teal);filter:brightness(1.1)}
.btn-outline{border-color:var(--control);color:var(--ink);background:var(--surface)}
.btn-outline:hover{border-color:var(--ink);color:var(--ink)}
.btn-teal-outline{border:2px solid var(--teal);color:var(--teal-ink);background:var(--surface)}
.btn-teal-outline:hover{background:var(--teal-tint);color:var(--teal-ink)}
.btn-ghost{color:var(--teal-ink);padding:0 6px;text-decoration:underline}
.btn-on-dark{border:2px solid var(--on-navy);color:var(--on-navy)}
.btn-on-dark:hover{background:rgba(255,255,255,.1);color:var(--on-navy)}
.btn-block{width:100%}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.chip{min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 16px;border-radius:999px;border:1.5px solid var(--control);background:var(--surface);color:var(--ink);font-size:.875rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--control);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{min-height:42px;padding:0 14px;border:0;background:none;cursor:pointer;font-size:.875rem}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--primary);color:var(--on-primary);font-weight:600}
.pill{min-height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 8px 0 12px;border-radius:999px;border:1px solid var(--teal);background:var(--teal-tint);color:var(--teal-ink);font-size:.875rem;font-weight:600;cursor:pointer}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:5px 8px;border-radius:6px;line-height:1.2}
.b-paced{background:var(--primary);color:var(--on-primary)}
.b-partner{background:var(--teal);color:var(--on-teal)}
.b-yt{background:#1B2838;color:#FFF;border:1px solid #FFFFFF33}
.b-updated{background:var(--blue-tint);color:var(--blue-ink)}
.b-cert{background:var(--teal-tint);color:var(--teal-ink)}
.b-type{background:var(--blue-tint);color:var(--blue-ink);text-transform:uppercase;letter-spacing:.06em}
.b-neutral{background:var(--neutral-tint);color:var(--ink)}
.b-outline{border:1.5px solid var(--ink);color:var(--ink)}
.lang{font-family:var(--mono);font-size:.6875rem;border:1px solid var(--control);padding:2px 6px;border-radius:4px}
.tagmap{display:inline-flex;gap:6px;align-items:center;font-size:.8125rem;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--blue-tint);color:var(--blue-ink)}
.tagmap b{font-weight:600}
.ai-label{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:600;color:var(--teal-ink)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;font-size:.9375rem;font-weight:600}
.field .hint{font-weight:400;font-size:.8125rem;color:var(--muted)}
.input,.select,.textarea{min-height:48px;padding:0 12px;border:1.5px solid var(--control);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:400;font-size:1rem;width:100%}
.textarea{padding:12px;min-height:110px;resize:vertical;line-height:1.5}
.input[aria-invalid="true"],.select[aria-invalid="true"],.textarea[aria-invalid="true"]{border:2px solid var(--ink)}
.err{display:flex;align-items:center;gap:6px;font-size:.875rem;font-weight:600;color:var(--ink)}
.err[hidden]{display:none}
.check{min-height:44px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.9375rem}
.check input{width:22px;height:22px;accent-color:var(--teal);flex-shrink:0}

/* header */
.util{background:var(--navy);color:var(--on-navy);font-size:.875rem}
.util .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;flex-wrap:wrap}
.util button,.util a{color:var(--on-navy)}
.util .ub{min-height:44px;background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:0 6px;font-size:.875rem}
.util .ub[aria-pressed="true"]{color:var(--navy-accent);font-weight:600}
.util .sep{width:1px;height:20px;background:#3A5577}
.util .soft{color:var(--navy-soft)}
.lang-btn{min-width:44px;min-height:32px;border-radius:6px;border:0;font-weight:600;cursor:pointer;background:transparent;color:var(--on-navy)}
.lang-btn[aria-pressed="true"]{background:var(--teal);color:var(--on-teal)}
.skip{position:absolute;left:8px;top:-60px;background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:8px;z-index:100;font-weight:600}
.skip:focus{top:8px}
.mainbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.mainbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--display);font-size:1.3rem;letter-spacing:.03em;display:block;line-height:1.1}
.brand span span{font-size:.8125rem;color:var(--muted)}
.nav{display:flex;align-items:center;gap:2px}
.nav a{min-height:44px;display:flex;align-items:center;padding:0 11px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:500;font-size:.9375rem;white-space:nowrap}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--blue-tint);color:var(--blue-ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--teal)}
.nav .btn{margin-left:8px}
.menu-btn{display:none}
.searchbar{background:var(--surface-2);border-bottom:1px solid var(--line)}
.searchbar form{display:flex;gap:8px;align-items:center;min-height:72px;padding-block:10px;flex-wrap:wrap}
.sbox{flex:1 1 240px;min-width:0;min-height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;border:1.5px solid var(--control);border-radius:8px;background:var(--surface)}
.sbox input{flex:1;min-width:0;border:0;outline:none;background:transparent;min-height:44px;font-size:1rem}
.sbox .mono{color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:.6875rem;white-space:nowrap}
.facet{position:relative}
.facet>button{min-height:48px;display:flex;align-items:center;gap:6px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:.875rem;white-space:nowrap}
.facet>button[data-count]:not([data-count="0"]){border:2px solid var(--primary);font-weight:600}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:260px;max-height:360px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 12px}
.pop .check{justify-content:flex-start}
.pop .check .n{margin-left:auto;color:var(--faint)}
@media (max-width:1180px){
  .nav{display:none}
  .menu-btn{display:inline-flex}
  .facet{display:none}
  .util .hide-sm{display:none}
}
@media (max-width:560px){
  .util .hide-xs{display:none}
  .brand span span{display:none}
}

main:focus,.amain:focus,[tabindex="-1"]:focus{outline:none}
@media (max-width:640px){.searchbar form{flex-wrap:nowrap}.sbox .mono{display:none}}
.select{max-width:100%}
/* drawer + modal */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay[hidden]{display:none}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:28px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.modal.wide{max-width:760px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.modal h2{font-size:1.625rem}
.drawer-wrap{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;justify-content:flex-end}
.drawer-wrap[hidden]{display:none}
.drawer{background:var(--surface);width:min(420px,100%);height:100%;overflow:auto;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.drawer nav a{min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--ink);text-decoration:none;font-size:1.0625rem;font-weight:500;border-bottom:1px solid var(--neutral-tint)}
.drawer nav a[aria-current="page"]{color:var(--teal-ink);font-weight:600}
.drawer section{padding:20px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.switch{width:56px;height:32px;border-radius:16px;border:2px solid var(--faint);background:var(--surface);padding:2px;display:flex;cursor:pointer;flex-shrink:0}
.switch span{width:24px;height:24px;border-radius:50%;background:var(--faint);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--teal);border-color:var(--teal)}
.switch[aria-checked="true"] span{transform:translateX(24px);background:var(--on-teal)}
.toggle-row{min-height:64px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--neutral-tint)}
.toggle-row>div{flex:1}

/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;gap:8px;width:min(520px,calc(100% - 32px))}
.toast{background:var(--primary);color:var(--on-primary);padding:12px 12px 12px 16px;border-radius:10px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;font-size:.9375rem;animation:tin .2s ease-out}
.toast button{margin-left:auto;background:none;border:1.5px solid currentColor;color:inherit;border-radius:6px;min-height:36px;padding:0 10px;font-weight:600;cursor:pointer}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* hero + home */
.hero{background:var(--navy);color:var(--on-navy)}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:center;padding-block:64px}
.hero h1{color:var(--on-navy);font-size:clamp(2.1rem,4.4vw,3.4rem);line-height:1.1}
.hero .lede{color:var(--navy-soft);font-size:1.1875rem}
.hero .eyebrow{color:var(--navy-accent)}
.country-card{background:var(--surface);color:var(--ink);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cgrid button{min-width:0;min-height:48px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.9375rem;text-align:left}
.cgrid button span:last-child{font-size:.8125rem;color:var(--faint)}
.cgrid button[aria-current="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal);font-weight:600}
.cgrid button[aria-current="true"] span:last-child{color:var(--on-teal)}
@media (max-width:900px){.hero .wrap{grid-template-columns:minmax(0,1fr);gap:32px;padding-block:40px}}
.stats{background:var(--surface);border-bottom:1px solid var(--line)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding-block:24px}
.stat{border-left:3px solid var(--teal);padding-left:14px}
.stat b{display:block;font-family:var(--display);font-size:1.9rem;font-weight:600}
@media (max-width:700px){.stats .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}}
.disc{display:flex;flex-direction:column;gap:6px;padding:22px;text-decoration:none;color:var(--ink);cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg)}
.disc:hover{border-color:var(--teal)}
.disc strong{font-family:var(--display);font-size:1.35rem;font-weight:600}
.cta-band{margin-block:56px 0;display:flex;gap:32px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:32px}

/* cards */
.ccard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.ccard .media{height:150px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.m-paced{background:#0B2545;color:#fff}
.m-partner{background:var(--teal-tint);border-bottom:1px solid var(--teal-line)}
.m-yt{background:#1B2838;color:#fff}
.ccard .media .disc-l{font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.m-paced .disc-l,.m-yt .disc-l{color:#8FD3CC}
.m-partner .disc-l{color:var(--teal-ink)}
.playbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-45%);width:60px;height:60px;border-radius:50%;border:0;background:#fff;color:#0B2545;display:flex;align-items:center;justify-content:center;cursor:pointer}
:root[data-lite] .ccard .media{height:auto;min-height:56px;gap:8px}
:root[data-lite] .ccard .media svg.deco{display:none}
:root[data-lite] .playbig{position:static;transform:none;width:44px;height:44px}
.ccard .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.ccard h3{font-size:1.15rem}
.ccard h3 a{color:var(--ink);text-decoration:none}
.ccard h3 a:hover{text-decoration:underline}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:.8125rem;margin:0}
.meta div{display:flex;gap:6px;align-items:center}
.meta dt{display:flex;color:var(--faint)}
.meta dd{margin:0}
.card-actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.ext-note{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.datebox{width:64px;height:72px;flex-shrink:0;border-radius:10px;background:#0B2545;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.datebox .m{font-family:var(--mono);font-size:.75rem;color:#8FD3CC;letter-spacing:.08em}

/* ---------- events ---------- */

document.addEventListener('keydown', e => {

    if (S.modal) { closeModal(); return; }
    if (S.drawer) { S.drawer = false; render(); return; }
    if (S.openFacet || S.openMenu || S.events.calOpen) { S.openFacet = null; S.openMenu = null; S.events.calOpen = null; render(); return; }
    if (S.facetsOpen) { S.facetsOpen = false; render(); }
  }
  if (e.key === 'Tab') {
    const scope = S.modal ? $('#overlay .modal') : S.drawer ? $('#drawer .drawer') : null;
    if (!scope) return;
    const f = [...scope.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex="0"]')].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }

/* ---------- search logic ---------- */
const labelOf = (k, id) => { const o = FACETS[k].opts.find(x => x[0] === id); return o ? L(o[1], o[2]) : id; };
function expand(tok) {

  return g ? g.concat(tok) : [tok];
}
function hay(r) {
  return [r.title, r.ru, r.summary, r.summaryRu, r.src, ...r.tags.flatMap(k => TAGS[k]), ...r.topic.map(id => labelOf('topic', id)), ...r.topic.flatMap(id => FACETS.topic.opts.find(o => o[0] === id).slice(1)), ...r.discipline.flatMap(id => FACETS.discipline.opts.find(o => o[0] === id).slice(1))].join(' ').toLowerCase();
}
const toks = () => S.search.q.toLowerCase().split(/[\s,]+/).filter(x => x.length > 1);
function matchQ(r) { const h = hay(r); return toks().every(tk => expand(tk).some(s => h.includes(s))); }
function filterRes(except) {

function filteredEvents() {
  const ev = S.events;

    if (d < 0 || d > Number(ev.range)) return false;

    if (ev.region !== 'all' && e.region !== ev.region) return false;

}

  const evDays = {}; EVENTS.forEach(e => { const p = localParts(e.utc); if (p.mo === mo) evDays[p.d] = (evDays[p.d] || []).concat(e); });
  let h = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(d => `<span class="dow">${d}</span>`).join('');

  return h;
}

        <span class="hint" id="wc">${wc} words${wc > 230 ? ' · longer than the 200-word target' : ''}</span>${er.sum ? `<span class="err">${I('alert', 16)} Write a summary of at least 30 words.</span>` : ''}</label></section>
    <section class="stack" style="--g:8px" aria-labelledby="st3"><h3 id="st3" style="font-family:var(--sans);font-size:1rem">3. Upload the reviewed document</h3>
      ${locked ? `<p class="small">${x.upload ? `${I('check', 14)} ${esc(x.upload)}` : 'Original document kept'}</p>` : `<label class="field" for="stg-file">Your corrected file (optional; leave empty to keep the original)<input id="stg-file" type="file" class="input" style="padding:10px" accept=".pdf,.doc,.docx,.xlsx" data-change="stgUpload" data-id="${x.id}"></label>${x.upload ? `<span class="small" style="color:var(--teal-ink);font-weight:600">${I('check', 14)} ${esc(x.upload)} uploaded</span>` : ''}`}</section>
    <section class="stack" style="--g:8px" aria-labelledby="st4"><h3 id="st4" style="font-family:var(--sans);font-size:1rem">4. Approval</h3>`;
  if (x.status === 'published') body += `<p class="note" style="border-color:var(--teal)">${I('check', 20)}<span><strong>Live on the site.</strong> ${esc((x.history.slice().reverse().find(h => /Approved/.test(h[1])) || ['', 'Approved'])[1])}.${x.resId ? ` <a href="#article-${x.resId}" data-act="closeModal">Open the live page</a>` : ''}</span></p>`;
  else if (x.status === 'awaiting') body += `<div class="panel pad stack" style="--g:10px;background:var(--surface-2)"><p class="small"><strong>Waiting for ${esc(lead)}.</strong> They were emailed a link to this item.</p>
      <p class="xs muted">Prototype: you are signed in as the editorial lead, so you can act on it now.</p>
      <label class="field" for="stg-note">Note to the reviewer (needed to request changes)<textarea id="stg-note" class="textarea" rows="2" aria-invalid="${!!er.note}">${esc(d.note || '')}</textarea>${er.note ? `<span class="err">${I('alert', 16)} Say what needs to change.</span>` : ''}</label>
      <div class="row"><button class="btn btn-teal" data-act="stgApprove" data-arg="${x.id}">${I('check', 16)} Approve and publish to live</button><button class="btn btn-outline" data-act="stgChanges" data-arg="${x.id}">Request changes</button></div></div>`;
  else body += `<form class="stack" data-form="stgSubmit" novalidate style="--g:10px"><label class="field" for="stg-appr">Who approves this?<select id="stg-appr" class="select" data-change="stgApprover" data-id="${x.id}">${LEADS.map(l => `<option value="${l[0]}" ${x.approver === l[0] ? 'selected' : ''}>${l[1]}</option>`).join('')}</select></label>
      ${x.approver === 'self' ? `<label class="check" style="align-items:flex-start"><input type="checkbox" id="stg-self" aria-invalid="${!!er.self}">I am the editorial lead and I approve this ${p ? 'translation' : 'item'} for the live site. Self-approval is recorded in the audit log.</label>${er.self ? `<span class="err">${I('alert', 16)} Tick the box to confirm you are approving as editorial lead.</span>` : ''}` : ''}
      ${!x.downloaded ? `<p class="xs muted">${I('info', 13)} You haven't downloaded the document yet. Reviewers usually read it before approving.</p>` : ''}
      <div class="row"><button type="submit" class="btn btn-primary">${x.approver === 'self' ? 'Approve and publish to live' : 'Send for approval'}</button><button type="button" class="btn btn-outline" data-act="closeModal">Save and close</button></div></form>`;
  body += `</section>`;
  if (!p && x.status === 'published') {
    body += `<section class="stack" style="--g:10px;border-top:1px solid var(--line);padding-top:16px" aria-labelledby="st5"><h3 id="st5" style="font-family:var(--sans);font-size:1rem">5. Translate with AI</h3>
      <p class="small muted">Translates the approved document and summary. Each translation then goes through the same steps: download, review, approval, publish.</p>
      ${d.translating ? `<p class="row small" style="--g:8px"><span class="spin"></span> Translating ${esc(x.file)}…</p>` : `<fieldset style="border:0;margin:0;padding:0"><legend class="sr">Languages</legend><div class="row" style="--g:4px 16px">${TR_TARGETS.map(([c, n]) => { const has = x.trs.map(stgItem).find(t => t.lang === c); return `<label class="check" style="min-height:40px"><input type="checkbox" id="tr-${c}" ${has ? 'disabled checked' : c === 'RU' ? 'checked' : ''}>${n}${has ? ` <span class="xs muted">(${STG_STATUS[has.status][0].toLowerCase()})</span>` : ''}</label>`; }).join('')}</div></fieldset>
      <div class="row"><button class="btn btn-primary" data-act="stgTranslate" data-arg="${x.id}">Translate document and summary</button>${x.trs.length ? `<button class="btn btn-ghost" data-act="stgTabClose" data-arg="translations">See translations</button>` : ''}</div>`}</section>`;
  }
  body += `<details><summary class="small" style="cursor:pointer;min-height:36px">Audit trail (${x.history.length})</summary><ol class="vlist" style="padding-top:8px">${x.history.map(h => `<li><span class="mono">${esc(h[0])}</span><span class="small">${esc(h[1])}</span></li>`).join('')}</ol></details>`;
  return modalShell(esc(x.title), body, { wide: true, badge: `<span class="row" style="--g:8px">${stgChip(x.status)}${p ? `<span class="badge b-neutral">${x.langName} translation</span>` : ''}</span>` });
};
MODALS.stgSheet = () => {
  const rows = S.stg.items.filter(x => !x.parent);
  const cols = ['Found', 'Source', 'Title', 'Link', 'Category', 'Lang', 'AI summary', 'Status', 'Open in staging'];
  return modalShell('PACED crawl results · spreadsheet', `<p class="small muted">A read-only copy the crawler updates after every run. Edit summaries in staging, so the spreadsheet and the site never disagree.</p>
    <div class="tscroll" style="border:1px solid var(--line);border-radius:8px"><table class="t mono" style="font-size:.75rem;min-width:980px"><thead><tr><th style="width:28px;text-align:center;background:var(--surface-2)"></th>${cols.map((c, i) => `<th style="background:var(--surface-2);padding:6px 8px;border-right:1px solid var(--line)">${String.fromCharCode(65 + i)} · ${c}</th>`).join('')}</tr></thead><tbody>
    ${rows.map((x, i) => `<tr><td style="text-align:center;color:var(--muted);background:var(--surface-2)">${i + 2}</td><td style="padding:6px 8px">${esc(x.history[0][0])}</td><td style="padding:6px 8px">${esc(x.src)}</td><td style="padding:6px 8px;font-family:var(--sans)">${esc(x.title)}</td><td style="padding:6px 8px">${esc(x.path)}</td><td style="padding:6px 8px">${CAT_NAME(x.cat)}</td><td style="padding:6px 8px">${x.lang}</td><td style="padding:6px 8px;font-family:var(--sans);max-width:300px">${esc((x.summary || x.ai).slice(0, 110))}…</td><td style="padding:6px 8px">${STG_STATUS[x.status][0]}</td><td style="padding:6px 8px"><button class="btn btn-ghost" style="min-height:28px;padding:0;font-size:.75rem" data-act="stgOpen" data-arg="${x.id}">Open</button></td></tr>`).join('')}
    </tbody></table></div>
    <div class="row"><button class="btn btn-primary" data-act="stgXlsx">${I('download', 16)} Download .xlsx</button><button class="btn btn-outline" data-act="stgGsheet">Open in Google Sheets ${I('ext', 14)}</button><button class="btn btn-outline" data-act="closeModal">Close</button></div>`, { wide: true });
};
MODALS.stgEmail = () => {
  const g = S.stg; const rows = g.items.filter(x => !x.parent && x.status !== 'published');
  const byCat = CATEGORIES.map(c => [c[1], rows.filter(x => x.cat === c[0]).length]).filter(c => c[1]);
  return modalShell('Digest email preview', `<div class="email-prev" style="gap:10px;padding:18px">
      <span class="mono xs muted">From: crawler@[paced-domain] · To: ${esc(g.recipients)} · ${esc(g.sentAt)}</span>
      <strong style="font-size:1.0625rem">PACED crawl digest: ${rows.length} items waiting for review</strong>
      <p class="small">${byCat.map(c => `${c[1]} ${c[0].toLowerCase()}`).join(' · ')}. The full list with links and AI summaries is attached as a spreadsheet${g.attach ? '' : ' (attachment turned off)'}.</p>
      <ul class="stack small" style="--g:8px;margin:0;padding-left:18px">${rows.slice(0, 4).map(x => `<li><strong>${esc(x.title)}</strong> <span class="muted">· ${esc(x.src)}</span><br><span class="muted">${esc(x.ai.slice(0, 110))}…</span></li>`).join('')}</ul>
      <div class="row" style="--g:8px"><button class="btn btn-teal" data-act="stgSheetFromEmail">Open the spreadsheet</button><button class="btn btn-outline" data-act="closeModal">Review in staging</button></div>
      ${g.attach ? `<span class="xs muted">${I('download', 12)} paced-crawl-${g.sentAt.slice(0, 6).replace(' ', '-').toLowerCase()}.xlsx · 24 KB</span>` : ''}</div>`);
};
MODALS.stgSettings = () => modalShell('Digest email settings', `<form class="stack" data-form="stgSettings" novalidate>
    <label class="field" for="ds-to">Send to (comma-separated)<input id="ds-to" class="input" value="${esc(S.stg.recipients)}"></label>
    <label class="field" for="ds-freq">How often<select id="ds-freq" class="select">${['After every crawl', 'Daily at 06:30', 'Weekly on Monday'].map(f => `<option ${S.stg.freq === f ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
    <label class="check"><input type="checkbox" id="ds-attach" ${S.stg.attach ? 'checked' : ''}>Attach the spreadsheet (.xlsx)</label>
    <label class="check"><input type="checkbox" id="ds-lead" checked>Email the editorial lead when something is sent for approval</label>
    <div class="row"><button class="btn btn-primary" type="submit">Save</button><button class="btn btn-outline" type="button" data-act="closeModal">Cancel</button></div></form>`);
const now = () => 'Today ' + new Date().toTimeString().slice(0, 5);
function stgPublish(x) {
  x.status = 'published';
  if (x.parent) {
    const p = stgItem(x.parent); const r = RESOURCES.find(y => y.id === p.resId);
    if (r && !r.langs.includes(x.lang)) r.langs.push(x.lang);
    if (r && x.lang === 'RU') { r.summaryRu = x.summary || x.ai; r.ru = x.titleRu || r.ru; }
    return `${x.langName} translation is live on the site`;
  }
  const type = { data: 'data', cases: 'case', guidelines: 'guideline', research: 'journal', news: 'news', events: 'news' }[x.cat] || 'article';
  const id = 'live-' + x.id; x.resId = id;
  RESOURCES.unshift({ id, type, title: x.title, ru: x.title, src: x.src + ' · reviewed by PACED editors', updated: '24 Sep 2026', version: 'v1', langs: ['EN'], country: COUNTRIES.map(c => c.id), discipline: ['nursing'], topic: ['policy'], audience: ['clinicians'], lite: x.size, full: x.size, read: Math.max(2, Math.round(words(x.summary || x.ai) / 40)), tags: ['policy'], summary: x.summary || x.ai, summaryRu: x.aiRu });
  if (type === 'news') S.banners.unshift({ id, title: x.title, source: x.src });
  return 'Live on the site: ' + x.title;
}
Object.assign(ACT, {
  stgTab(k) { S.stg.tab = k; render(); },
  stgTabClose(k) { S.stg.tab = k; closeModal(); },
  stgOpen(id) { const x = stgItem(id); if (x.status === 'new') { x.status = 'review'; x.history.push([now(), 'Review started by you']); } S.modal = null; openModal('stgReview', { id }); },
  stgDownload(id) { const x = stgItem(id); x.downloaded = true; x.history.push([now(), 'Downloaded by you']); render(); toast(`Downloaded ${x.file}. Prototype: no file is saved.`); },
  stgApprove(id) { const x = stgItem(id); x.history.push([now(), 'Approved by Dr A. Karimova and published']); const msg = stgPublish(x); render(); toast(msg); },
  stgChanges(id) { const x = stgItem(id); const note = ($('#stg-note') || {}).value || ''; if (!note.trim()) { S.modal.data.errors = { note: 1 }; render(); return; } x.note = note; x.status = 'changes'; x.history.push([now(), 'Changes requested: ' + note]); S.modal.data.errors = {}; render(); toast('Sent back to the reviewer with your note'); },
  stgTranslate(id) {
    const x = stgItem(id); const langs = TR_TARGETS.filter(([c]) => { const el = $('#tr-' + c); return el && el.checked && !el.disabled; });
    if (!langs.length) { toast('Choose at least one language'); return; }
    S.modal.data.translating = true; render();
    setTimeout(() => {
      langs.forEach(([c, n]) => {
        const t = mkItem({ id: x.id + '-' + c, parent: x.id, lang: c, langName: n, src: x.src, url: x.url, path: x.path, cat: x.cat, conf: 'n/a', size: x.size, title: x.title,
          file: x.file.replace(/(\.\w+)$/, `-${c.toLowerCase()}$1`), ai: c === 'RU' ? x.aiRu : `[${n} machine translation of the approved summary. In the live platform the AI translation service writes it here.] ${x.summary || x.ai}`,
          history: [[now(), `Machine-translated into ${n} from the approved English version`]] });
        S.stg.items.push(t); x.trs.push(t.id);
      });
      x.history.push([now(), 'AI translation requested: ' + langs.map(l => l[1]).join(', ')]);
      if (S.modal) S.modal.data.translating = false; render();
      toast(`${langs.length} translation${langs.length > 1 ? 's' : ''} ready for review. Find them under Translations.`);
    }, 1500);
  },
  stgCrawl() { const g = S.stg; g.crawling = true; render(); setTimeout(() => {
    g.crawling = false; g.sentAt = '24 Sep 2026, ' + new Date().toTimeString().slice(0, 5);
    g.items.unshift(mkItem({ id: 'd' + Date.now(), src: 'EAPC', url: 'https://eapcnet.eu', path: 'eapcnet.eu/[event]', file: 'eapc-webinar-spiritual-care.html', size: '120 KB', cat: 'events', lang: 'EN', conf: '91%', title: 'Webinar: spiritual care at the end of life in diverse cultures', history: [['Just now', 'Found by the AI crawler; summary drafted']],
      ai: 'A one-hour webinar on 12 November 2026 for nurses and chaplains on assessing spiritual needs, working with faith leaders and supporting families from different religious traditions. Free, in English with Russian captions.', aiRu: 'Часовой вебинар 12 ноября 2026 года о духовных потребностях пациентов в конце жизни.' }));
    render(); toast('Crawl finished: 1 new link. Spreadsheet updated and digest email sent.'); }, 1400); },
  stgSheet() { openModal('stgSheet'); }, stgEmail() { openModal('stgEmail'); }, stgSettings() { openModal('stgSettings'); },
  stgSheetFromEmail() { S.modal = null; openModal('stgSheet'); },
  stgXlsx() { toast('paced-crawl-results.xlsx prepared. The prototype can’t save files.'); },
  stgGsheet() { toast('Opens the shared Google Sheet in the live platform.'); }
});
INPUT.stgSummary = (v, el) => { const x = stgItem(el.dataset.id); x.summary = v; const wc = $('#wc'); const n = words(v); if (wc) wc.textContent = n + ' words' + (n > 230 ? ' · longer than the 200-word target' : ''); };
CHANGE.stgUpload = (v, el) => { const x = stgItem(el.dataset.id); const f = el.files[0]; if (!f) return; x.upload = f.name; x.history.push([now(), 'Reviewed document uploaded: ' + f.name]); render(); toast(f.name + ' uploaded to staging'); };
CHANGE.stgApprover = (v, el) => { stgItem(el.dataset.id).approver = v; render(); };
FORMS.stgSubmit = () => {
  const d = S.modal.data; const x = stgItem(d.id); const sum = x.summary ?? x.ai; const e = {};
  if (words(sum) < 30) e.sum = 1;
  if (x.approver === 'self' && !($('#stg-self') || {}).checked) e.self = 1;
  d.errors = e; if (Object.keys(e).length) { render(); const f = $('#overlay [aria-invalid="true"]'); f && f.focus(); return; }
  if (!x.summary) x.summary = x.ai;
  if (x.approver === 'self') { x.history.push([now(), 'Approved by you as editorial lead (self-approved) and published']); const msg = stgPublish(x); render(); toast(msg); }
  else { x.status = 'awaiting'; x.history.push([now(), 'Sent to Dr A. Karimova for approval']); render(); toast('Sent for approval. Dr A. Karimova has been emailed.'); }
};
FORMS.stgSettings = f => { S.stg.recipients = f.querySelector('#ds-to').value || S.stg.recipients; S.stg.freq = f.querySelector('#ds-freq').value; S.stg.attach = f.querySelector('#ds-attach').checked; closeModal(); toast('Digest settings saved'); };
/* ---------- boot ---------- */
parseHash();
render(true);
window.addEventListener('hashchange', () => {
  if (S.route === 'article' && !S.ageOk && !S.modal) { const r = RESOURCES.find(x => x.id === S.param); if (r && r.topic.includes('pain')) openModal('age'); }
  if (S.route === 'courses' && S.courses.isPlaying) tick();
});
if (S.route === 'article' && !S.ageOk) { const r = RESOURCES.find(x => x.id === S.param); if (r && r.topic.includes('pain')) openModal('age'); }

</script>
</body>
